# /etc/nginx/sites-available/digitalapricot.io
# Static Astro build of Digital Apricot, served from the root of digitalapricot.io.
# Files are rsynced to /var/www/html/digitalapricot/ by the GitHub deploy workflow.
#
# Install this HTTP-only version first, then let certbot add HTTPS and the http->https redirect:
#   sudo certbot --nginx -d digitalapricot.io -d www.digitalapricot.io --redirect
server {
    listen 80;
    listen [::]:80;
    server_name digitalapricot.io www.digitalapricot.io;

    # One canonical host: www goes to the apex.
    if ($host = www.digitalapricot.io) {
        return 301 https://digitalapricot.io$request_uri;
    }

    root /var/www/html/digitalapricot;
    index index.html;
    charset utf-8;
    server_tokens off;  # (also set this in the http{} block of nginx.conf)

    # Private SEO dashboard at /seo/, behind a password (seo-agent/deploy/seo-dashboard.conf).
    include snippets/seo-dashboard.conf;

    # Old slug that was merged into another guide. Astro also writes a meta-refresh page as a fallback.
    location = /best-budget-gaming-mice { return 301 /best-mice-for-gaming-and-work; }

    location / {
        # Astro builds with format:"file", so /best-laptops -> /best-laptops.html.
        # A trailing .html in a request redirects to the clean URL, so there is one URL per page.
        if ($request_uri ~ ^/(.+)\.html$) {
            return 301 /$1;
        }
        try_files $uri $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;

    # Hashed assets are immutable.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # ads.txt and robots.txt must be plain text at the root.
    location = /ads.txt { default_type text/plain; try_files $uri =404; }
    location = /robots.txt { default_type text/plain; try_files $uri =404; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/manifest+json application/rss+xml application/atom+xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is only honoured over HTTPS; certbot's 443 block copies server-level headers, but
    # add it there if it does not (see notes). Enable once HTTPS is confirmed working.
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
