# /etc/nginx/snippets/protocloud-blog.conf
# The blog moved from protocloudsolutions.com/blog to digitalapricot.io. This snippet stays
# included in the 443 server block of /etc/nginx/sites-available/protocloudsolutions.com,
# above `location / { ... }`, and now only redirects:
#     include snippets/protocloud-blog.conf;
# Every old URL 301s to the same page on the new domain, so rankings move with it.

# Old slug merged into another guide: straight to its final URL, no redirect chain.
location = /blog/best-budget-gaming-mice { return 301 https://digitalapricot.io/best-mice-for-gaming-and-work; }

# DevOps posts from the old main-site blog, removed on 2026-08-18 and not coming back.
# 410 tells search engines to drop them faster than a 404 does. They don't move.
location = /blog/google-io-devops-cloud-antigravity { return 410; }
location = /blog/sre-slos-error-budgets { return 410; }
location = /blog/finops-cloud-cost-optimization { return 410; }
location = /blog/reliable-cicd-pipelines { return 410; }
location = /blog/cavaliers-knicks-nba-devops-cloud-ai { return 410; }
location = /blog/platform-engineering-vs-devops { return 410; }
location = /blog/kubernetes-platform-basics { return 410; }

location = /blog { return 301 https://digitalapricot.io/; }

# ^~ stops the main site's regex asset location from catching /blog/*.js, *.svg etc.
location ^~ /blog/ {
    # /blog/x.html and /blog/x both go to /x. The sitemap moved to the new root too.
    rewrite ^/blog/sitemap.*\.xml$ https://digitalapricot.io/sitemap-index.xml permanent;
    rewrite ^/blog/(.+?)(?:\.html)?/?$ https://digitalapricot.io/$1 permanent;
    return 301 https://digitalapricot.io/;
}
