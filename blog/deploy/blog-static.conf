# /etc/nginx/snippets/blog-static.conf
# Shared by the http and https server blocks for the blog.

index index.html;
charset utf-8;

# Astro builds with format:"file", so /best-laptops -> /best-laptops.html
location / {
    try_files $uri $uri.html $uri/index.html =404;
}
error_page 404 /404.html;

# Hashed assets are immutable.
location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# AdSense verifies these exact paths. Serve as text, never fall through to HTML.
location = /ads.txt   { default_type text/plain; add_header Cache-Control "public, max-age=86400"; }
location = /robots.txt { default_type text/plain; }

location ~* \.(png|jpe?g|webp|avif|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}

gzip on;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
