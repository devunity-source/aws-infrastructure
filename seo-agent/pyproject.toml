[project]
name = "seo-agent"
version = "0.6.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]  # post frontmatter

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only for the Search Console API commands (sites, fetch). The CSV path needs nothing.
api = ["google-auth>=2.40,<3", "requests>=2.32,<3"]

[project.scripts]
seo-agent = "seo_agent.cli:main"

[tool.setuptools]
packages = ["seo_agent"]

[tool.setuptools.package-data]
seo_agent = ["templates/*.html"]
