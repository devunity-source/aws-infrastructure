# /etc/nginx/snippets/seo-dashboard.conf
# Serves the private SEO dashboard at https://digitalapricot.io/seo/ behind a password.
# Included in the server block of /etc/nginx/sites-available/digitalapricot.io (see
# digitalapricot/deploy/digitalapricot.io.conf). It also still works at protocloudsolutions.com/seo/,
# where it's included in that site's 443 block next to the blog snippet. Nothing in it is domain-specific:
#     include snippets/seo-dashboard.conf;
# The weekly run (seo-agent/scripts/weekly.sh) writes index.html into /var/www/html/seo-dashboard/.

location = /seo { return 301 /seo/; }

# ^~ stops the main site's regex asset location from catching anything under /seo/.
location ^~ /seo/ {
    alias /var/www/html/seo-dashboard/;
    index index.html;

    auth_basic "SEO dashboard";
    auth_basic_user_file /etc/nginx/seo-dashboard.htpasswd;

    # Private, never cached or indexed. The page makes no external requests, so the
    # policy can be strict. Its inline script is also pinned by hash in a meta tag.
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
