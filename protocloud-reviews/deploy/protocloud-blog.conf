# /etc/nginx/snippets/protocloud-blog.conf
# Serves the static Astro build at protocloudsolutions.com/blog next to the main Vite SPA.
# Include it inside the 443 server block of /etc/nginx/sites-available/protocloudsolutions.com,
# above `location / { ... }`:
#     include snippets/protocloud-blog.conf;
# Files are rsynced to /var/www/html/protocloud-reviews/blog/ by deploy/deploy.sh.

# Permanent redirects. Exact matches win over the ^~ /blog/ block below.
# Astro also writes a meta-refresh page for these, which stays as a fallback.
location = /blog/best-budget-gaming-mice { return 301 /blog/best-mice-for-gaming-and-work; }

# DevOps posts from the old main-site blog, removed on 2026-08-18 and not coming back.
# 410 tells search engines to drop them faster than a 404 does.
location = /blog/google-io-devops-cloud-antigravity { return 410; }
location = /blog/sre-slos-error-budgets { return 410; }
location = /blog/finops-cloud-cost-optimization { return 410; }
location = /blog/reliable-cicd-pipelines { return 410; }
location = /blog/cavaliers-knicks-nba-devops-cloud-ai { return 410; }
location = /blog/platform-engineering-vs-devops { return 410; }
location = /blog/kubernetes-platform-basics { return 410; }

location = /blog {
    root /var/www/html/protocloud-reviews;
    try_files /blog/index.html =404;
}

# ^~ stops the main site's regex asset location from catching /blog/*.js, *.svg etc.
location ^~ /blog/ {
    root /var/www/html/protocloud-reviews;
    index index.html;
    charset utf-8;

    # Astro builds with format:"file", so /blog/best-laptops -> /blog/best-laptops.html
    try_files $uri $uri.html $uri/index.html =404;
    error_page 404 /blog/404.html;

    # Hashed assets are immutable.
    location ^~ /blog/_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
