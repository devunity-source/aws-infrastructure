# /etc/nginx/sites-available/blog.protocloudsolutions.com
# Static Astro build served next to the main Vite SPA on the same box.
# After copying: ln -s /etc/nginx/sites-available/blog.protocloudsolutions.com /etc/nginx/sites-enabled/
#                sudo certbot --nginx -d blog.protocloudsolutions.com
#                sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name blog.protocloudsolutions.com;

    # certbot replaces this block with a 301 to https once the cert is issued.
    root /var/www/blog.protocloudsolutions.com;
    include snippets/blog-static.conf;
}

